name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Unitarias, build y arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verificar:arquitectura

  contrato:
    name: Contrato de los cuatro adaptadores
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preparar
      - run: pnpm test:contrato
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-contrato
          path: docs/entrega-2/evidencia-contrato.md

  e2e:
    name: E2E contra los cuatro motores
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preparar
      - run: pnpm --filter @historiales/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:motores
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-e2e
          path: |
            e2e/reporte
            e2e/test-results
            docs/entrega-2/capturas
