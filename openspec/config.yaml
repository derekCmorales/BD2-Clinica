schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: plataforma de historiales clínicos para cuatro instituciones, cada una con
  su motor (Hospital→PostgreSQL con Event Sourcing, Odontología→MySQL CRUD,
  Laboratorio→MongoDB, Pediátrico→Redis como sistema de registro). NestJS hexagonal
  + cliente React con UI idéntica para las cuatro. Fuente de verdad: AGENTS.md y
  LINEAMIENTOS.md.

  Reglas que toda propuesta respeta:
  - dominio/ no importa infraestructura; casos de uso sin `if` por motor.
  - Las decisiones de modelado (esquema, embeber/referenciar, estructuras Redis,
    reconstrucción desde eventos, concurrencia optimista, proyector, idempotencia,
    nivel de aislamiento) las toma el estudiante. Una propuesta sobre esos temas
    presenta alternativas y trade-offs y deja la tarea bloqueada en "Decisión".
  - Ningún dato restringido en logs; todo acceso restringido se audita.
  - Fuera de alcance: Kafka, gRPC, microservicios, sagas, Firebase, Kubernetes.

rules:
  proposal:
    - Declarar explícitamente qué queda fuera de alcance.
    - Si toca un tema de modelado reservado, listar alternativas en vez de elegir.
  tasks:
    - Tareas de máximo ~2 horas.
    - Marcar con "[DECISIÓN]" las tareas que esperan una decisión del estudiante.
